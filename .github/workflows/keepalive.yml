# Render (bepul) 15 daqiqa so'rov bo'lmasa servisni uxlatadi.
# Kunduzi (Toshkent 08:00–23:00 = UTC 03:00–18:00) har 5 daqiqada botni "chertamiz".
# Kechasi uxlashiga ruxsat: hisobdagi 750 soat/oy ikkala botga yetishi uchun
# (15 soat x 31 kun ~ 465 soat; qolgani kirish-test-botga).
name: keepalive
on:
  schedule:
    - cron: "*/5 3-17 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -o /dev/null -w "%{http_code}\n" --max-time 120 https://link-tahlil-bot.onrender.com/ || true
